<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Conectando Talentos e Carreiras</title>
    <!-- Link para o CSS principal -->
    <link rel="stylesheet" href="style.css">
    <!-- Favicon utilizando o SVG -->
    <link rel="icon" href="./assets/img/logo.svg" type="image/svg+xml">
</head>
<body>

    <!-- Cabeçalho do Site -->
    <header class="header-site">
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <img src="./assets/img/logo.svg" alt="Ícone SkillMatch" class="logo-img">
                <span class="logo-text">SKILLMATCH</span>
            </a>
            <nav class="nav-menu">
                <a href="#vagas">Vagas</a>
                <a href="#perfil">Meu Perfil</a>
                <a href="#analiticas">Analíticas</a>
            </nav>
        </div>
    </header>

    <!-- Seção Principal / Hero -->
    <main>
        <section class="hero-section">
            <div class="container hero-content">
                <h1>Conectando Talentos, Construindo Carreiras</h1>
                <p>Encontra as melhores oportunidades de emprego alinhadas com as tuas competências técnicas e comportamentais.</p>
                <a href="#perfil" class="btn-primary">Criar Meu Perfil Profissional</a>
            </div>
        </section>

        <!-- Seções dinâmicas do projeto (Vagas, Formulário, etc.) -->
        <section id="perfil" class="container section-padding">
            <!-- Conteúdo manipulado via JavaScript (fetch, localStorage, etc.) -->
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="footer-site">
        <div class="container">
            <p>&copy; 2026 SkillMatch Web. Desenvolvido para o Módulo 1.</p>
        </div>
    </footer>

    <!-- Script principal em JavaScript ES6 -->
    <script src="script.js" type="module"></script>
