<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkillMatch - Analise seu perfil e encontre a vaga ideal na área de tecnologia.">
    <title>SkillMatch | Encontre sua Vaga</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body>
    <header>
        <nav>
            <img src="./assets/img/logo.svg" alt="Logotipo SkillMatch" title="SkillMatch">
            <h1>SkillMatch</h1>
        </nav>
    </header>

    <main>
        <section id="perfil-candidato">
            <h2>Seu Perfil Profissional</h2>
            <form id="form-perfil">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="input-group">
                    <label for="area">Área de Interesse</label>
                    <select id="area" name="area" required>
                        <option value="">Selecione...</option>
                        <option value="Front-End">Front-End</option>
                        <option value="Back-End">Back-End</option>
                        <option value="Full-Stack">Full-Stack</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="habilidades">Habilidades (separadas por vírgula)</label>
                    <input type="text" id="habilidades" name="habilidades" placeholder="Ex: HTML, CSS, JavaScript" required>
                </div>
                <div class="input-group">
                    <label for="experiencia">Tempo de Experiência (anos)</label>
                    <input type="number" id="experiencia" name="experiencia" min="0" required>
                </div>
                <button type="submit">Analisar Compatibilidade</button>
            </form>
        </section>

        <!-- O JavaScript vai injetar os estados de loading, erro e os cards aqui dentro -->
        <section id="area-resultados" aria-live="polite">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SkillMatch. Avaliação Módulo 1.</p>
    </footer>

    <!-- Importação em módulo, como exigido -->
    <script type="module" src="./assets/scripts/main.js"></script>
</body>
</html>
